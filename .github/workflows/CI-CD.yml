name: CI/CD

on:
  push:
    branches:
      - main
jobs:
  lint:
    runs-on: ubuntu-latest
    container: abourtnik/laravel
    steps:
      - uses: actions/checkout@v4
      - name: 📦Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: ⚙️Run PHPStan
        run: ./vendor/bin/phpstan analyse --memory-limit=2G
  test:
    runs-on: ubuntu-latest
    container: abourtnik/laravel
    steps:
      - uses: actions/checkout@v4
      - name: 📦Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: ⚙️ Run tests
        run: php artisan test --env=ci --stop-on-failure
  build:
    runs-on: ubuntu-latest
    container: oven/bun
    steps:
      - uses: actions/checkout@v4
      - name: 📦Install dependencies
        run: bun install
      - name: ⚙️Build assets
        run: bun run build
      - name: ⬆️Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: public-build
          path: public/build/
          retention-days: 1
  deploy:
    runs-on: ubuntu-latest
    needs: [ lint, test, build ]
    environment: Production
    steps:
      - name: ⬇️Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: public-build
          path: public/build/
      - name: ⬇️Upload build
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: public/build/
          target: /home/anton/www/tchat.antonbourtnik.fr/public/
      - name: 🚀Deploy updates
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/anton/www/tchat.antonbourtnik.fr
            make deploy
